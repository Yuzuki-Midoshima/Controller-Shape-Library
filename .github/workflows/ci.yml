name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-tests:
    name: Data tests (Python 3.11)
    # Maya 2026 is primarily validated on Windows, and PySide6 can load there
    # without Linux display-system packages such as libEGL.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install PySide6

      - name: Check Python syntax
        run: python -m compileall -q controller_shape_library launch_controller_shape_library.py

      - name: Run Maya-independent data tests
        run: python tests/run_data_tests.py
