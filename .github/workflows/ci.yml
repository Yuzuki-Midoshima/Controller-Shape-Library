name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-tests:
    name: Data tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q controller_shape_library launch_controller_shape_library.py

      - name: Run Maya-independent data tests
        run: python -m unittest discover -s tests -p "test_controller_shape_data.py" -v
